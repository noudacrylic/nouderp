[machine]
# IP address mesin fingerprint (set IP statik di router/mesin)
ip = 0.0.0.0

# Port — ZKTeco K40 default = 4370
port = 4370

# Serial Number (sama persis dengan yang terdaftar di ERP / panel Mesin).
# Cek di mesin: Menu -> Sys Info -> Device Info, atau di stiker belakang.
serial_number = CHANGE_ME

# Timeout koneksi ke mesin (detik)
timeout = 10

# Force UDP atau TCP? ZKTeco K40 biasanya UDP di port 4370.
# Kalau UDP gagal/timeout, coba false (TCP).
force_udp = true

# Comm key (password mesin), 0 = no password
password = 0

[erp]
# Endpoint ERP — kalau script jalan di komputer XAMPP yang sama, pakai 127.0.0.1
endpoint = http://127.0.0.1:8000/iclock/cdata

# HTTP timeout ke ERP (detik)
http_timeout = 10

[poll]
# Interval polling (detik). Recommended: 30
interval_seconds = 30

# State file — simpan timestamp last fetched record supaya tidak duplicate
state_file = state.json

# Log file (kosong = output ke stdout)
log_file = sync.log
